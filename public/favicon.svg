<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Six strings crossed by a swipe streak — the strum gesture IS the mark
       (CLAUDE.md §17). Reads at 16px and in mono. -->
  <rect width="32" height="32" rx="7" fill="#0D0F14"/>
  <g stroke="#FFB84D" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <path d="M7 6v20M11 6v20M15 6v20M19 6v20M23 6v20"/>
  </g>
  <path d="M5 22L27 10" stroke="#FFB84D" stroke-width="3.2" stroke-linecap="round"/>
</svg>
